[package]
name = "minicord-next"
version = "0.1.0"
description = "High-performance, modern Discord client with live dynamic theming"
authors = ["Dr4m"]
edition = "2021"

[lib]
name = "minicord_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "native-tls", "multipart"] }
futures-util = "0.3"
chrono = "0.4"
base64 = "0.22"

[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
opt-level = 2
codegen-units = 16
lto = false
panic = "abort"
strip = true
